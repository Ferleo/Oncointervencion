<section class="contacto-section py-5">
  <div class="container">
    <h2 class="text-center mb-4" i18n>Contáctanos</h2>
    <form class="mx-auto" style="max-width: 500px;" (ngSubmit)="enviar()" [formGroup]="form">
      <div class="mb-3">
        <label for="nombre" class="form-label" i18n>Nombre</label>
        <input id="nombre" type="text" class="form-control" formControlName="nombre" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label" i18n>Email</label>
        <input id="email" type="email" class="form-control" formControlName="email" required>
      </div>
      <div class="mb-3">
        <label for="mensaje" class="form-label" i18n>Mensaje</label>
        <textarea id="mensaje" rows="4" class="form-control" formControlName="mensaje" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid || enviado()" i18n>Enviar</button>
      <div *ngIf="enviado()" class="alert alert-success mt-3" role="alert" i18n>
        ¡Mensaje enviado con éxito!
      </div>
    </form>
  </div>
</section>
